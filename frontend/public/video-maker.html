<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <title>EarnPulse Viral Reel / Shorts Video Generator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { max-width: 480px; width: 100%; text-align: center; }
    h1 { font-size: 20px; color: #10b981; margin-bottom: 8px; }
    p { font-size: 13px; color: #94a3b8; margin-bottom: 16px; }
    .preview-box { position: relative; width: 360px; height: 640px; margin: 0 auto 20px; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border: 3px solid #1e293b; background: #020617; }
    canvas { width: 100%; height: 100%; display: block; }
    .btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 14px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); display: inline-flex; align-items: center; gap: 8px; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-bar { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; margin-top: 14px; overflow: hidden; display: none; }
    .progress-fill { width: 0%; height: 100%; background: #10b981; transition: width 0.1s; }
    .status-text { margin-top: 8px; font-size: 13px; color: #38bdf8; font-weight: bold; min-height: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎬 EarnPulse রিলস / শর্টস ভিডিও মেকার</h1>
    <p>নিচের বাটনে চাপ দিলে ২০ সেকেন্ডের একটি আকর্ষণীয় প্রমো ভিডিও তৈরি হয়ে ডাউনলোড হবে!</p>

    <div class="preview-box">
      <canvas id="videoCanvas" width="720" height="1280"></canvas>
    </div>

    <button id="renderBtn" class="btn" onclick="startRecording()">
      <span>🎥 ভিডিও তৈরি ও ডাউনলোড করুন (MP4)</span>
    </button>

    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status-text" id="statusText">রেডি - বাটনে চাপ দিন</div>
  </div>

  <script>
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');
    const renderBtn = document.getElementById('renderBtn');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('statusText');

    const WIDTH = 720;
    const HEIGHT = 1280;
    const DURATION = 18; // 18 seconds
    const FPS = 30;
    const TOTAL_FRAMES = DURATION * FPS;

    // Draw frame function for any time t (0 to 18)
    function drawFrame(t) {
      // 1. Dark Luxury Gradient Background
      const bgGrad = ctx.createLinearGradient(0, 0, 0, HEIGHT);
      bgGrad.addColorStop(0, '#020617');
      bgGrad.addColorStop(0.5, '#064e3b');
      bgGrad.addColorStop(1, '#020617');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Glowing floating circles
      for (let i = 0; i < 5; i++) {
        const cx = (WIDTH / 6) * (i + 1) + Math.sin(t * 2 + i) * 30;
        const cy = 200 + (HEIGHT / 6) * i + Math.cos(t * 1.5 + i) * 40;
        const rad = 80 + Math.sin(t + i) * 20;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
        g.addColorStop(0, 'rgba(16, 185, 129, 0.15)');
        g.addColorStop(1, 'rgba(16, 185, 129, 0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx, cy, rad, 0, Math.PI * 2);
        ctx.fill();
      }

      // Top Brand Header
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('⚡ EarnPulse Official ⚡', WIDTH / 2, 90);

      ctx.fillStyle = '#34d399';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText('হোয়াটসঅ্যাপ দিয়ে সহজ অনলাইন আয়', WIDTH / 2, 135);

      // SCENE 1: (0s - 4.5s) The Big Hook
      if (t < 4.5) {
        const scale = Math.min(1, t * 1.5);
        ctx.save();
        ctx.translate(WIDTH / 2, HEIGHT / 2);
        ctx.scale(scale, scale);

        // Big Offer Card
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(-300, -320, 600, 640, 32);
        ctx.fill();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 65px sans-serif';
        ctx.fillText('🔥 মেগা অফার 🔥', 0, -200);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 42px sans-serif';
        ctx.fillText('কোনো কাজ ছাড়া', 0, -110);
        ctx.fillText('প্রতিদিন নিশ্চিত ইনকাম!', 0, -45);

        // Big Cash Badge
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.roundRect(-240, 40, 480, 120, 24);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 50px sans-serif';
        ctx.fillText('৳ ৩২০ - ১,০০০ টাকা', 0, 118);

        ctx.fillStyle = '#a7f3d0';
        ctx.font = 'bold 28px sans-serif';
        ctx.fillText('✓ ফোনে ইন্টারনেট অফ থাকলেও চলবে', 0, 230);
        ctx.restore();
      }

      // SCENE 2: (4.5s - 9s) How to Connect (Step 1)
      else if (t < 9.0) {
        const localT = t - 4.5;
        ctx.save();
        ctx.translate(WIDTH / 2, HEIGHT / 2);

        // Card Box
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(-300, -320, 600, 640, 32);
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 44px sans-serif';
        ctx.fillText('ধাপ ১: WhatsApp কানেক্ট', 0, -220);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText('আপনার নম্বর দিয়ে', 0, -140);
        ctx.fillText('৮ ডিজিটের পেয়ারিং কোড নিন:', 0, -90);

        // Pairing Code Box
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(-240, -20, 480, 110, 20);
        ctx.fill();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Pulsing Code
        ctx.fillStyle = '#34d399';
        ctx.font = 'bold 52px monospace';
        ctx.fillText('A 8 K 2 - 9 P 4 X', 0, 55);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '28px sans-serif';
        ctx.fillText('হোয়াটসঅ্যাপের Linked Devices এ বসিয়ে', 0, 160);
        ctx.fillText('১ ক্লিকে সচল করুন!', 0, 210);

        ctx.restore();
      }

      // SCENE 3: (9s - 13.5s) Live Income Growing
      else if (t < 13.5) {
        const localT = t - 9.0;
        ctx.save();
        ctx.translate(WIDTH / 2, HEIGHT / 2);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(-300, -320, 600, 640, 32);
        ctx.fill();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#4ade80';
        ctx.font = 'bold 44px sans-serif';
        ctx.fillText('🟢 স্ট্যাটাস: Online', 0, -220);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText('২৪ ঘণ্টা কানেক্টেড থাকলেই', 0, -140);
        ctx.fillText('অটোমেটিক ব্যালেন্স জমা!', 0, -90);

        // Animated Balance Counter
        const currentBal = Math.min(320, Math.floor(32 + (localT / 4.5) * 288));
        ctx.fillStyle = '#064e3b';
        ctx.beginPath();
        ctx.roundRect(-240, -10, 480, 130, 24);
        ctx.fill();
        ctx.strokeStyle = '#34d399';
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 64px sans-serif';
        ctx.fillText('৳ ' + currentBal + '.০০', 0, 78);

        ctx.fillStyle = '#a7f3d0';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText('🎁 ১০টি নম্বর = ১,০০০৳ স্পেশাল বক্স!', 0, 190);
        ctx.fillText('👥 রেফারেল বোনাস ১৫% লাইফটাইম!', 0, 240);

        ctx.restore();
      }

      // SCENE 4: (13.5s - 18s) Instant Withdraw & CTA
      else {
        const localT = t - 13.5;
        ctx.save();
        ctx.translate(WIDTH / 2, HEIGHT / 2);

        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        ctx.roundRect(-300, -320, 600, 640, 32);
        ctx.fill();
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 48px sans-serif';
        ctx.fillText('⚡ সুপার ফাস্ট উইথড্র ⚡', 0, -220);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 34px sans-serif';
        ctx.fillText('সরাসরি বিকাশ ও নগদ-এ টাকা নিন!', 0, -140);

        // bKash & Nagad Badges
        ctx.fillStyle = '#e11d48';
        ctx.beginPath();
        ctx.roundRect(-230, -70, 210, 70, 16);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText('bKash বিকাশ', -125, -25);

        ctx.fillStyle = '#ea580c';
        ctx.beginPath();
        ctx.roundRect(20, -70, 210, 70, 16);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 30px sans-serif';
        ctx.fillText('Nagad নগদ', 125, -25);

        // Big Call to Action
        ctx.fillStyle = '#10b981';
        ctx.beginPath();
        ctx.roundRect(-260, 40, 520, 100, 24);
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 40px sans-serif';
        ctx.fillText('🚀 আজই ফ্রি জয়েন করুন 🚀', 0, 105);

        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 32px sans-serif';
        ctx.fillText('👇 সাইট লিঙ্ক বায়োতে / কমেন্টে 👇', 0, 210);

        ctx.restore();
      }

      // Bottom Watermark
      ctx.fillStyle = '#64748b';
      ctx.font = '22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('EarnPulse • ১০০% নিরাপদ ও বিশ্বস্ত আয়ের প্ল্যাটফর্ম', WIDTH / 2, HEIGHT - 50);
    }

    // Initial frame preview
    drawFrame(2.0);

    // Live Recording Engine using MediaRecorder
    async function startRecording() {
      renderBtn.disabled = true;
      progressBar.style.display = 'block';
      statusText.innerText = 'ভিডিও তৈরি হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন';

      const stream = canvas.captureStream(FPS);
      let options = { mimeType: 'video/webm; codecs=vp9' };
      if (!MediaRecorder.isTypeSupported(options.mimeType)) {
        options = { mimeType: 'video/webm' };
      }

      const recorder = new MediaRecorder(stream, options);
      const chunks = [];

      recorder.ondataavailable = e => {
        if (e.data.size > 0) chunks.push(e.data);
      };

      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'EarnPulse_Viral_Reel.mp4';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        statusText.innerText = '✅ ভিডিও সফলভাবে ডাউনলোড হয়েছে! (EarnPulse_Viral_Reel.mp4)';
        renderBtn.disabled = false;
        renderBtn.innerHTML = '<span>✅ আবার ডাউনলোড করুন</span>';
      };

      recorder.start();

      let currentFrame = 0;
      const interval = setInterval(() => {
        const t = (currentFrame / TOTAL_FRAMES) * DURATION;
        drawFrame(t);

        currentFrame++;
        const percent = Math.floor((currentFrame / TOTAL_FRAMES) * 100);
        progressFill.style.width = percent + '%';
        statusText.innerText = `ভিডিও ফ্রেম তৈরি হচ্ছে: ${percent}% (${Math.floor(t)}s / ${DURATION}s)`;

        if (currentFrame >= TOTAL_FRAMES) {
          clearInterval(interval);
          recorder.stop();
        }
      }, 1000 / FPS);
    }
  </script>
</body>
</html>
